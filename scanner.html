<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASMA - scanner camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#16120e;--panel:#241d16;--ink:#eee2cd;--muted:#ad9d82;--line:#4b3d30;--accent:#d49350}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,Segoe UI,sans-serif}
  body{display:grid;grid-template-columns:330px 1fr;gap:12px;padding:12px}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  h1{font-size:16px;margin:0 0 6px}
  p{font-size:12px;color:var(--muted);line-height:1.4;margin:0 0 10px}
  button,select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;background:#33291f;color:var(--ink);font:inherit;margin:4px 0}
  button.primary{background:var(--accent);color:#21170d;border-color:var(--accent);font-weight:700}
  button.active{background:#6f8a4a;border-color:#92b767;color:#fff}
  button.ai{border-color:#5f7ea8;background:#26384d}
  .toggle-row{display:flex;align-items:center;gap:8px;min-height:34px;margin:3px 0;color:var(--ink);font-size:12px}
  .toggle-row input{width:18px;height:18px;accent-color:var(--accent)}
  dialog{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0;width:min(920px,calc(100vw - 28px));max-height:calc(100vh - 28px)}
  dialog::backdrop{background:rgba(5,4,3,.78)}
  .dialog-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .dialog-head h2{font-size:14px;margin:0}
  .icon-button{width:38px;min-width:38px;height:38px;margin:0;font-size:22px;line-height:1}
  .calibration-body{padding:12px;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:12px}
  .calibration-actions{display:flex;flex-direction:column}
  .calibration-results{display:grid;gap:10px;align-content:start}
  #status{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}
  main{display:grid;gap:10px}
  .stage{position:relative;min-height:55vh;background:#050505;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  video{opacity:0}
  #boardCrop{display:none;background:#050505}
  #calibrationCrop{position:static;display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain;background:#050505;border:1px solid var(--line);border-radius:7px}
  #preview{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#111;border:1px solid var(--line);padding:2px;max-width:520px}
  #debug{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:860px}
  #calibGuide{background:#241d16;border:1px solid var(--line);border-radius:8px;padding:10px;max-width:520px}
  #calibGuide h2{font-size:13px;margin:0 0 6px;color:var(--ink)}
  #calibGuide p{font-size:11px;margin:0 0 8px;color:var(--muted)}
  #matrixReport{max-width:860px}
  #matrixReport:empty{display:none}
  .matrix-report{background:#241d16;border:1px solid var(--line);border-radius:8px;padding:10px}
  .matrix-report h2{font-size:13px;margin:0 0 7px}
  .matrix-summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .matrix-score{border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:11px}
  .matrix-colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .matrix-color{border-left:5px solid var(--swatch);background:#19140f;padding:5px 7px;font-size:10px;min-width:0}
  .matrix-errors{margin:8px 0 0;font-size:10px;color:var(--muted);line-height:1.45}
  .guide-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#111;padding:2px}
  .guide-cell{aspect-ratio:1;background:#3a332b;border:1px solid #5a4b3b;display:grid;place-items:center;font-size:9px;color:#d8c9ae;position:relative}
  .guide-cell.target{background:#fff;color:#111;border:2px solid #111}
  .guide-token{width:68%;aspect-ratio:1;border-radius:50%;border:2px solid #111;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:800}
  .dbg{background:#241d16;border:1px solid var(--line);border-radius:7px;padding:7px;font-size:11px;color:var(--ink)}
  .dbg b{display:block;margin-bottom:4px}.dbg .sw{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid #fff;vertical-align:-2px;margin-right:4px}
  .cell{aspect-ratio:1;background:#f5f5f5;color:#111;display:grid;place-items:center;font-size:11px;font-weight:800;position:relative}
  .cell.board-dark{background:#b8b8b8}
  .cell .pawn-dot{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:#e44;border:2px solid #fff;box-shadow:0 0 0 1px #111}
  .cell .mini-token{width:58%;aspect-ratio:1;border-radius:50%;background:#d93b34;border:2px solid #fff;box-shadow:0 0 0 1px #111;display:grid;place-items:center}
  .cell .mini-token svg{width:72%;height:72%;overflow:visible}
  .cell .mini-token span{font-size:9px;color:#fff;text-shadow:0 1px 2px #000;max-width:90%;overflow:hidden;text-overflow:ellipsis}
  .cell .score{position:absolute;right:2px;bottom:1px;font-size:8px;color:#111;background:rgba(255,255,255,.76);border-radius:3px;padding:0 2px}
  .cell .unknown{position:absolute;font-size:13px;color:#fff;z-index:1}
  .cell .ai-badge{position:absolute;left:2px;top:2px;font-size:7px;line-height:14px;padding:0 3px;background:#26384d;color:#fff;border-radius:3px;z-index:2}
  .cell.needs-review{outline:4px solid #f0a12b;outline-offset:-4px}
  .cell .review-badge{position:absolute;right:2px;top:2px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:#f0a12b;color:#17120b;font-size:12px;font-weight:900;z-index:3}
  #reviewSummary{max-width:860px}
  #reviewSummary:empty{display:none}
  .review-summary{background:#33291f;border:1px solid #f0a12b;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.45;color:var(--ink)}
  .water{background:#006cb6;color:white}.mountain{background:#744018;color:white}.hill{background:#5c8e24;color:white}
  .place{background:#fff;border:4px solid #111}.jolly{background:#fff2b9;border:4px solid #111}
  body.dashboard{display:block;padding:0;overflow:hidden}
  body.dashboard main>:not(.stage),body.dashboard>dialog{display:none}
  body.dashboard main{display:block;height:100vh}
  body.dashboard .stage{width:100%;height:100%;min-height:0;border:0;border-radius:0}
  body.dashboard dialog[open]{display:block}
  /* nella console il pannello camera e' un piccolo riquadro (#cameraDock,
     230px): l'aside intera coi suoi bottoni non ci sta e non serve, li
     duplica gia' index.html via postMessage — ma la SCELTA della camera
     (portatile con webcam frontale + camera USB secondaria) non ha un
     equivalente fuori dall'iframe, quindi resta l'unico controllo visibile,
     ridotto a un piccolo selettore sovrapposto in alto. */
  body.dashboard aside{position:absolute;top:6px;left:6px;z-index:5;
    background:transparent;border:0;padding:0;width:auto;min-width:0}
  body.dashboard aside>*{display:none}
  body.dashboard aside #camera{display:block;width:auto;max-width:calc(100vw - 12px);
    min-height:0;margin:0;font-size:10px;padding:3px 5px;
    background:rgba(20,16,11,.82);border:1px solid rgba(238,226,205,.35);color:var(--ink)}
  @media (max-width:850px){body{display:block}.stage{height:55vh;margin-top:10px}.matrix-colors{grid-template-columns:repeat(2,minmax(0,1fr))}.calibration-body{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).has('dashboard'))document.body.classList.add('dashboard')</script>
<aside>
  <h1>Scanner camera</h1>
  <p>Rileva la scacchiera e acquisisci le pedine.</p>
  <select id="camera"></select>
  <button class="primary" id="start">Avvia camera</button>
  <button id="track">Rileva scacchiera</button>
  <button id="manual">Imposta a mano</button>
  <button id="scan">Rileva pedine</button>
  <button class="ai" id="aiScan">Verifica forme con AI</button>
  <button class="ai" id="aiCorners">Proponi bordi con AI</button>
  <label class="toggle-row"><input id="autoAi" type="checkbox" checked> Controlla ogni pedina con AI</label>
  <button id="openCalibration">Calibrazione...</button>
  <details>
    <summary>Diagnostica</summary>
    <button id="copyDebug">Copia debug</button>
    <button id="saveSnapshot">Scarica snapshot</button>
    <button id="loadSnapshotButton">Carica snapshot</button>
  </details>
  <input id="loadSnapshot" type="file" accept="application/json" hidden>
  <button class="primary" id="send">Usa nella mappa</button>
  <div id="status">Pronto.</div>
</aside>
<main>
  <div class="stage"><video id="video" playsinline muted></video><canvas id="canvas"></canvas><canvas id="boardCrop"></canvas></div>
  <div id="reviewSummary"></div>
  <div id="preview"></div>
  <div id="debug"></div>
</main>
<dialog id="calibrationDialog">
  <div class="dialog-head"><h2>Calibrazione scanner</h2><button class="icon-button" id="closeCalibration" title="Chiudi" aria-label="Chiudi">&times;</button></div>
  <div class="calibration-body">
    <div class="calibration-actions">
      <button id="calibrateBoard">Calibra base vuota</button>
      <button id="calibrateColors">Calibra 8 colori</button>
      <button id="calibrateRed">Calibra rosso</button>
      <button id="matrixTest">Rileva e valuta 8 x 5</button>
      <button id="resetCalibration">Reset calibrazione</button>
    </div>
    <div class="calibration-results"><canvas id="calibrationCrop" width="400" height="400"></canvas><div id="calibGuide"></div><div id="matrixReport"></div></div>
  </div>
</dialog>
<script>
function onOpenCvScriptLoaded(){
  try{
    const ready=module=>{
      window.cv=module||window.cv;
      window.asmaCvReady=!!window.cv?.Mat;
      document.dispatchEvent(new Event('asma-cv-ready'));
    };
    if(window.cv?.calledRun)ready(window.cv);
    else if(typeof window.cv?.then==='function')window.cv.then(ready);
    else ready(window.cv);
  }catch(error){
    window.asmaCvError=error?.message||String(error);
    document.dispatchEvent(new Event('asma-cv-error'));
  }
}
</script>
<script async src="vendor/opencv.js" onload="onOpenCvScriptLoaded()"></script>

function scan(silent=false){

  if(!boardVision){
    setStatus(`Rilevatore globale non disponibile${lastGlobalDetectorError?`: ${lastGlobalDetectorError}`:'.'}`);
    return false;
  }
  buildGridFromVision();
  renderPreview();
  const found=boardVision.flat().filter(cell=>cell.pawn).length;
  const uncertain=boardVision.flat().filter(cell=>derivedReviewReasons(cell).length).length;
  if(!silent)setStatus(`Rilevatore globale: ${found} pedine trovate${uncertain?`, ${uncertain} celle da controllare`:''}. Controlla anteprima, poi invia alla mappa.`);

    if(seen.pawn){
      if(seen.terrain)lastGrid[r][c]={kind:'terrain',terrain:seen.terrain};
      else if(seen.cat)lastGrid[r][c]={kind:'place',cat:seen.cat,ord:++ord};
      else if(seen.jolly!=null)lastGrid[r][c]={kind:'jolly',j:seen.jolly,ord:++ord};
      continue;

async function scanStable(){

  button.disabled=true;

    for(let pass=0;pass<3;pass++){
      setStatus(`Stabilizzazione lettura ${pass+1}/3...`);
      if(!scan(true))return false;
      visions.push(structuredClone(boardVision));
      if(pass<2)await new Promise(resolve=>setTimeout(resolve,160));
    }
    boardVision=aggregateVisions(visions);
    buildGridFromVision();renderPreview();
    const found=boardVision.flat().filter(cell=>cell.pawn).length;
    const uncertain=boardVision.flat().filter(cell=>derivedReviewReasons(cell).length).length;
    setStatus(`Lettura stabilizzata su 3 fotogrammi: ${found} pedine trovate${uncertain?`, ${uncertain} celle dubbie`:''}.`);

    out[r][c].dark=all.filter(cell=>cell.dark).length>=needed;
    const pawns=all.filter(cell=>cell.pawn);
    if(pawns.length<needed){
      const candidates=all.filter(cell=>cell.pawn||cell.possiblePawn);
      if(candidates.length>=needed){
        const selected=candidates.sort((a,b)=>(b.presenceConfidence||0)-(a.presenceConfidence||0))[0];
        Object.assign(out[r][c],selected,{dark:out[r][c].dark,pawn:false,possiblePawn:true,cat:null,reviewReasons:['presenza']});

      }

    const labels=new Map();
    for(const pawn of pawns){
      const key=pawn.cat||`color:${pawn.color?.id||'unknown'}`;
      const item=labels.get(key)||{count:0,total:0};
      item.count++;item.total+=pawn.shapeConfidence||pawn.score||0;labels.set(key,item);

  const button=document.getElementById('matrixTest');button.disabled=true;
  try{
    const ok=await scanWithAutomaticAi();
    if(ok)evaluateMatrixResult();
  }finally{button.disabled=false}
}
function send(silent=false){
  const sig=JSON.stringify(lastGrid);
  if(silent&&sig===lastSentSignature)return;
  lastSentSignature=sig;
  const payload={source:'camera-scanner',time:Date.now(),grid:lastGrid};
  try{localStorage.setItem(KEY,JSON.stringify(payload))}catch(e){}
  try{new BroadcastChannel(CH).postMessage(payload)}catch(e){}
  if(window.parent!==window)window.parent.postMessage({type:'asma-scanner-grid',payload},location.origin);
  if(!silent)setStatus('Acquisizione inviata alla mappa.');
}
function nearestCorner(viewX,viewY){
  let best={i:-1,d:Infinity};
  corners.forEach((p,i)=>{
    const v=videoToView(p), d=Math.hypot(v.x-viewX,v.y-viewY);
    if(d<best.d)best={i,d};
  });
  return best.d<28?best.i:-1;
}
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(manualMode){
    const p=viewToVideo(x,y);
    if(corners.length>=4)corners=[];
    corners.push(p);
    trackQuality=corners.length===4?.75:.2;
    setStatus(corners.length<4?'Angolo '+corners.length+' impostato. Continua in ordine 1 alto-sinistra, 2 alto-destra, 3 basso-destra, 4 basso-sinistra.':'Angoli manuali pronti. Trascina per correggere, poi Rileva pedine.');
    if(corners.length===4){manualMode=false;document.getElementById('manual').classList.remove('active')}
    return;
  }
  if(corners.length!==4)return;
  draggingCorner=nearestCorner(x,y);
  if(draggingCorner>=0){
    canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
    corners[draggingCorner]=viewToVideo(x,y);
    setStatus('Correzione manuale angolo '+(draggingCorner+1)+'.');
  }
});
canvas.addEventListener('pointermove',e=>{
  if(draggingCorner<0)return;
  const r=canvas.getBoundingClientRect();
  corners[draggingCorner]=viewToVideo(e.clientX-r.left,e.clientY-r.top);
});
canvas.addEventListener('pointerup',()=>{draggingCorner=-1});
canvas.addEventListener('pointercancel',()=>{draggingCorner=-1});
document.getElementById('start').onclick=()=>start().catch(e=>setStatus('Errore camera: '+e.message));
document.getElementById('track').onclick=detectOnce;
document.getElementById('manual').onclick=e=>{
  manualMode=true;corners=[];trackQuality=0;
  e.currentTarget.classList.add('active');
  setStatus('Clicca i 4 angoli: 1 alto-sinistra, 2 alto-destra, 3 basso-destra, 4 basso-sinistra.');
};
document.getElementById('scan').onclick=()=>scanWithAutomaticAi();
document.getElementById('aiScan').onclick=()=>verifyWithAi();
document.getElementById('aiCorners').onclick=()=>proposeAiCorners();
const calibrationDialog=document.getElementById('calibrationDialog');
document.getElementById('openCalibration').onclick=()=>calibrationDialog.showModal();
document.getElementById('closeCalibration').onclick=()=>calibrationDialog.close();
calibrationDialog.addEventListener('close',()=>parent.postMessage({type:'asma-scanner-calibration',open:false},location.origin));
const autoAiToggle=document.getElementById('autoAi');
autoAiToggle.checked=localStorage.getItem(AUTO_AI_KEY)!=='0';
autoAiToggle.onchange=()=>localStorage.setItem(AUTO_AI_KEY,autoAiToggle.checked?'1':'0');
document.getElementById('calibrateBoard').onclick=()=>calibrateBoard();
document.getElementById('calibrateColors').onclick=()=>calibrateColors();
document.getElementById('calibrateRed').onclick=()=>calibrateRed();
document.getElementById('matrixTest').onclick=()=>runMatrixTest();
document.getElementById('resetCalibration').onclick=()=>{
  colorCalibration=null;boardCalibration=null;
  localStorage.removeItem(COLOR_CAL_KEY);localStorage.removeItem(BOARD_CAL_KEY);
  document.getElementById('calibrateBoard').classList.remove('active');
  setStatus('Calibrazione colore e base cancellata.');
};
document.getElementById('copyDebug').onclick=()=>{
  const txt=JSON.stringify(lastDebug,null,2);
  if(navigator.clipboard)navigator.clipboard.writeText(txt);
  setStatus('Debug copiato: '+lastDebug.length+' celle annotate.');
};
document.getElementById('saveSnapshot').onclick=()=>{
  if(!rawCanvas.width){setStatus('Nessun frame camera disponibile.');return}
  scan(true);
  const payload={
    version:1,
    createdAt:new Date().toISOString(),
    video:{width:rawCanvas.width,height:rawCanvas.height},
    corners,
    colorCalibration,
    boardCalibration,
    assumeFullGrid,
    debug:lastDebug,
    candidates:lastCandidateDebug,
    ai:lastAiResult,
    allCells:allCellDebug(),
    grid:lastGrid,
    image:rawCanvas.toDataURL('image/jpeg',.86)
  };
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='asma-camera-snapshot.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  setStatus('Snapshot scaricato. Allegamelo qui e posso testare sul frame reale.');
};
document.getElementById('loadSnapshotButton').onclick=()=>document.getElementById('loadSnapshot').click();
async function loadSnapshotPayload(payload){
  if(!payload.image||!Array.isArray(payload.corners)||payload.corners.length!==4)throw new Error('snapshot incompleto');
  if(stream)stream.getTracks().forEach(track=>track.stop());
  stream=null;video.srcObject=null;
  const image=new Image();
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=payload.image});
  staticFrame=image;
  corners=payload.corners.map(point=>({x:point.x,y:point.y}));
  if(payload.colorCalibration){
    colorCalibration=payload.colorCalibration;
    localStorage.setItem(COLOR_CAL_KEY,JSON.stringify(colorCalibration));
  }
  if(payload.boardCalibration){
    boardCalibration=payload.boardCalibration;
    localStorage.setItem(BOARD_CAL_KEY,JSON.stringify(boardCalibration));
    document.getElementById('calibrateBoard').classList.add('active');
  }else{
    boardCalibration=null;
    localStorage.removeItem(BOARD_CAL_KEY);
    document.getElementById('calibrateBoard').classList.remove('active');
  }
  assumeFullGrid=false;
  boardVision=emptyVision();
  ensureDrawLoop();
  setStatus('Snapshot caricato. Avvio il nuovo rilevatore globale.');
  requestAnimationFrame(()=>scan(false));
}
document.getElementById('loadSnapshot').onchange=async event=>{
  const file=event.target.files?.[0];
  if(!file)return;
  try{
    await loadSnapshotPayload(JSON.parse(await file.text()));
  }catch(error){
    setStatus(`Impossibile caricare lo snapshot: ${error?.message||error}`);
  }finally{event.target.value=''}
};
document.getElementById('send').onclick=()=>send(false);
window.addEventListener('message',async event=>{
  if(event.origin!==location.origin)return;
  if(event.data?.type==='asma-scanner-stop'){
    if(stream)stream.getTracks().forEach(track=>track.stop());
    stream=null;video.srcObject=null;return;
  }
  if(event.data?.type!=='asma-scanner-command')return;
  const command=event.data.command;
  if(command==='start')return start().catch(error=>setStatus('Errore camera: '+error.message));
  if(command==='track')return proposeAiCorners({fallbackToLocal:true});
  if(command==='manual')return document.getElementById('manual').click();
  if(command==='scan')return scanWithAutomaticAi(true);
  if(command==='open-calibration'){
    if(!calibrationDialog.open)calibrationDialog.showModal();
    parent.postMessage({type:'asma-scanner-calibration',open:true},location.origin);return;
  }
  if(command==='close-calibration'){
    if(calibrationDialog.open)calibrationDialog.close();return;
  }
  if(command==='status')setStatus(savedCalibrationStatus());
});
listCameras().catch(()=>{});
renderCalibrationGuide();
renderPreview();
document.getElementById('calibrateBoard').classList.toggle('active',!!boardCalibration);
setStatus(savedCalibrationStatus());
const snapshotUrl=new URLSearchParams(location.search).get('snapshot');
if(snapshotUrl)fetch(snapshotUrl).then(response=>response.json()).then(loadSnapshotPayload).catch(error=>setStatus(`Test snapshot fallito: ${error?.message||error}`));
</script>

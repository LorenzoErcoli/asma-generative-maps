<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASMA - scanner camera</title>
<style>
  :root{--bg:#16120e;--panel:#241d16;--ink:#eee2cd;--muted:#ad9d82;--line:#4b3d30;--accent:#d49350}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  body{display:grid;grid-template-columns:330px 1fr;gap:12px;padding:12px}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  h1{font-size:16px;margin:0 0 6px}
  p{font-size:12px;color:var(--muted);line-height:1.4;margin:0 0 10px}
  button,select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;background:#33291f;color:var(--ink);font:inherit;margin:4px 0}
  button.primary{background:var(--accent);color:#21170d;border-color:var(--accent);font-weight:700}
  button.active{background:#6f8a4a;border-color:#92b767;color:#fff}
  #status{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}
  main{display:grid;gap:10px}
  .stage{position:relative;min-height:55vh;background:#050505;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  video{opacity:0}
  #preview{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#111;border:1px solid var(--line);padding:2px;max-width:520px}
  #debug{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:860px}
  .dbg{background:#241d16;border:1px solid var(--line);border-radius:7px;padding:7px;font-size:11px;color:var(--ink)}
  .dbg b{display:block;margin-bottom:4px}.dbg .sw{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid #fff;vertical-align:-2px;margin-right:4px}
  .cell{aspect-ratio:1;background:#f5f5f5;color:#111;display:grid;place-items:center;font-size:11px;font-weight:800;position:relative}
  .cell.board-dark{background:#b8b8b8}
  .cell .pawn-dot{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:#e44;border:2px solid #fff;box-shadow:0 0 0 1px #111}
  .cell .mini-token{width:58%;aspect-ratio:1;border-radius:50%;background:#d93b34;border:2px solid #fff;box-shadow:0 0 0 1px #111;display:grid;place-items:center}
  .cell .mini-token svg{width:72%;height:72%;overflow:visible}
  .cell .mini-token span{font-size:9px;color:#fff;text-shadow:0 1px 2px #000;max-width:90%;overflow:hidden;text-overflow:ellipsis}
  .cell .score{position:absolute;right:2px;bottom:1px;font-size:8px;color:#111;background:rgba(255,255,255,.76);border-radius:3px;padding:0 2px}
  .cell .unknown{position:absolute;font-size:13px;color:#fff;z-index:1}
  .water{background:#006cb6;color:white}.mountain{background:#744018;color:white}.hill{background:#5c8e24;color:white}
  .place{background:#fff;border:4px solid #111}.jolly{background:#fff2b9;border:4px solid #111}
  @media (max-width:850px){body{display:block}.stage{height:55vh;margin-top:10px}}
</style>
</head>
<body>
<aside>
  <h1>Scanner camera</h1>
  <p>Premi Rileva scacchiera per stimare gli angoli, poi trascina i quattro pallini se serve. La lettura usa solo la griglia interna corretta a mano.</p>
  <select id="camera"></select>
  <button class="primary" id="start">Avvia camera</button>
  <button id="track">Rileva scacchiera</button>
  <button id="manual">Imposta a mano</button>
  <button id="scan">Leggi colori</button>
  <button id="calibrateColors">Calibra colori</button>
  <button id="resetCalibration">Reset calibrazione</button>
  <button id="fullGridMode">Griglia piena spenta</button>
  <button id="terrainMode">Terreni spenti</button>
  <button id="copyDebug">Copia debug</button>
  <button id="saveSnapshot">Scarica snapshot</button>
  <button id="send">Invia alla mappa</button>
  <div id="status">Pronto.</div>
</aside>
<main>
  <div class="stage"><video id="video" playsinline muted></video><canvas id="canvas"></canvas></div>
  <div id="preview"></div>
  <div id="debug"></div>
</main>

  {kind:'place',cat:'osteria',id:'osteria',hex:CAT_COLOR.osteria}
];
let stream=null, corners=[], lastGrid=Array.from({length:N},()=>Array(N).fill(null)), boardVision=emptyVision(), ord=0;
let lastSentSignature='', lastDebug=[], trackQuality=0, draggingCorner=-1, manualMode=false, readTerrains=false, assumeFullGrid=false;
let colorCalibration=loadColorCalibration();
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const rawCanvas=document.createElement('canvas'), rawCtx=rawCanvas.getContext('2d',{willReadFrequently:true});
const status=document.getElementById('status'), preview=document.getElementById('preview'), debugEl=document.getElementById('debug'), cameraSel=document.getElementById('camera');
const ICON_TEMPLATES=buildIconTemplates();
function setStatus(t){status.textContent=t}
document.addEventListener('asma-cv-ready',()=>setStatus('OpenCV.js pronto. Puoi leggere la scacchiera.'));
function emptyVision(){return Array.from({length:N},()=>Array.from({length:N},()=>({dark:false,pawn:false,cat:null,terrain:null,jolly:null,score:0,debug:null,color:null,top:[],code:null,ink:0})))}
async function listCameras(){
  const devices=await navigator.mediaDevices.enumerateDevices();
  const cams=devices.filter(d=>d.kind==='videoinput');
  cameraSel.innerHTML=cams.map((d,i)=>`<option value="${d.deviceId}">${d.label||'Camera '+(i+1)}</option>`).join('');
}
async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const deviceId=cameraSel.value||undefined;
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:deviceId?{exact:deviceId}:undefined,width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream;await video.play();await listCameras();drawLoop();setStatus('Camera attiva. Premi Rileva scacchiera.');
}
function fit(){
  const rect=canvas.getBoundingClientRect(), vw=video.videoWidth||1, vh=video.videoHeight||1;
  const s=Math.min(rect.width/vw,rect.height/vh), w=vw*s, h=vh*s, ox=(rect.width-w)/2, oy=(rect.height-h)/2;
  return {rect,vw,vh,s,w,h,ox,oy};
}
function viewToVideo(x,y){
  const f=fit();return {x:(x-f.ox)/f.s,y:(y-f.oy)/f.s};
}
function videoToView(p){
  const f=fit();return {x:f.ox+p.x*f.s,y:f.oy+p.y*f.s};
}
function drawLoop(){
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*devicePixelRatio;canvas.height=rect.height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,rect.width,rect.height);
  const f=fit();
  if(video.videoWidth&&video.videoHeight){
    if(rawCanvas.width!==video.videoWidth||rawCanvas.height!==video.videoHeight){
      rawCanvas.width=video.videoWidth;rawCanvas.height=video.videoHeight;
    }
    rawCtx.drawImage(video,0,0,rawCanvas.width,rawCanvas.height);
  }
  ctx.drawImage(video,f.ox,f.oy,f.w,f.h);
  drawOverlay();
  requestAnimationFrame(drawLoop);
}
function drawOverlay(){
  ctx.lineWidth=2;ctx.strokeStyle=trackQuality>.55?'#87d37c':'#ffb24d';ctx.fillStyle=ctx.strokeStyle;
  corners.forEach((p,i)=>{const v=videoToView(p);ctx.beginPath();ctx.arc(v.x,v.y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#21170d';ctx.fillText(String(i+1),v.x-3,v.y+4);ctx.fillStyle=ctx.strokeStyle});
  if(corners.length===4){
    drawVisionOverlay();
    const pts=corners.map(videoToView);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<4;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.stroke();
    ctx.globalAlpha=.55;
    for(let i=1;i<N;i++){
      const a=boardPoint(i/N,0),b=boardPoint(i/N,1),c=boardPoint(0,i/N),d=boardPoint(1,i/N);
      line(a,b);line(c,d);
    }
    ctx.globalAlpha=1;
  }
}
function line(a,b){a=videoToView(a);b=videoToView(b);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function rawPixel(x,y){
  if(!rawCanvas.width||!rawCanvas.height)return new Uint8ClampedArray([0,0,0,255]);
  x=Math.max(0,Math.min(rawCanvas.width-1,Math.round(x)));
  y=Math.max(0,Math.min(rawCanvas.height-1,Math.round(y)));
  return rawCtx.getImageData(x,y,1,1).data;
}
function drawVisionOverlay(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=boardVision[r][c];
    if(v.dark){
      ctx.fillStyle='rgba(70,70,70,.28)';
      fillCell(r,c);
    }
    if(v.pawn){
      const p=videoToView(boardPoint((c+.5)/N,(r+.5)/N));
      ctx.fillStyle='#e44';
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.stroke();
      if(v.cat){
        ctx.fillStyle='#fff';
        ctx.strokeStyle='#111';
        ctx.lineWidth=3;
        ctx.font='11px system-ui,sans-serif';
        ctx.strokeText(v.cat.slice(0,3),p.x+9,p.y+4);
        ctx.fillText(v.cat.slice(0,3),p.x+9,p.y+4);
      }
    }
  }
}
function fillCell(r,c){
  const pts=[
    videoToView(boardPoint(c/N,r/N)),
    videoToView(boardPoint((c+1)/N,r/N)),
    videoToView(boardPoint((c+1)/N,(r+1)/N)),
    videoToView(boardPoint(c/N,(r+1)/N))
  ];
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fill();
}
function detectOnce(){
  const found=detectBoardCorners();
  if(!found){
    trackQuality=0;
    setStatus('Non ho trovato la scacchiera. Sposta camera o luce, poi riprova.');
    return false;
  }
  corners=found.map(p=>({x:p.x,y:p.y}));
  trackQuality=found.quality||.8;
  setStatus('Scacchiera rilevata. Trascina i pallini per correggere, poi Leggi colori.');
  return true;
}
function detectBoardCorners(){
  const f=fit(), step=Math.max(4,Math.round(Math.max(f.vw,f.vh)/180));
  const byMarkers=detectCornerMarkers(f,Math.max(2,Math.round(step*.75)));
  if(byMarkers)return byMarkers;
  const byDarkFrame=detectBoardByDarkFrame(f,Math.max(2,Math.round(step*.55)));
  if(byDarkFrame)return byDarkFrame;
  const byPattern=detectBoardByCheckerPattern(f,step);
  if(byPattern)return byPattern;
  const pts=[];
  for(let y=0;y<f.vh;y+=step)for(let x=0;x<f.vw;x+=step){
    const d=rawPixel(x,y);
    const max=Math.max(d[0],d[1],d[2]), min=Math.min(d[0],d[1],d[2]), l=(d[0]+d[1]+d[2])/3;
    if(l>205&&max-min<42)pts.push({x,y});
  }
  if(pts.length<90)return null;
  const buckets=new Map(), seen=new Set(), key=p=>Math.round(p.x/step)+','+Math.round(p.y/step);
  for(const p of pts)buckets.set(key(p),p);
  let best=[];
  for(const p of pts){
    const k=key(p);if(seen.has(k))continue;
    const q=[p], comp=[];seen.add(k);

function scan(silent=false){

  const samples=Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>sampleCell(r,c,.24)));
  boardVision=buildBoardVision(samples);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const seen=boardVision[r][c];
    if(seen.pawn){
      if(seen.terrain)lastGrid[r][c]={kind:'terrain',terrain:seen.terrain};
      else if(seen.cat)lastGrid[r][c]={kind:'place',cat:seen.cat,ord:++ord};
      else if(seen.jolly!=null)lastGrid[r][c]={kind:'jolly',j:seen.jolly,ord:++ord};
      continue;
    }
    if(readTerrains){
      const terrain=terrainAt(r,c);
      if(terrain){lastGrid[r][c]={kind:'terrain',terrain};continue}
    }
  }
  renderPreview();
  if(!silent)setStatus('Scacchiera letta. Controlla anteprima, poi invia alla mappa.');
  else setStatus('Scacchiera letta dalla griglia corrente.');

}

  return out;
}
function compactRgb(o){
  return o?{r:+o.r.toFixed(1),g:+o.g.toFixed(1),b:+o.b.toFixed(1),l:+o.l.toFixed(1),count:o.count||null,spread:o.spread?+o.spread.toFixed(1):null}:null;
}
function calibrateColors(){
  if(corners.length!==4){setStatus('Prima calibra gli angoli della scacchiera.');return false}
  const learned=[];
  const details=[];
  for(let c=0;c<N;c++){
    const spec=COLOR_TEST_COLUMNS[c], pts=[];
    for(let r=0;r<N;r++){
      const sample=sampleKnownTokenColor(r,c);
      if(sample)pts.push(sample);
    }
    if(pts.length<3){
      details.push(`${spec.id}: ${pts.length}/8`);
      continue;
    }
    const avg=k=>pts.reduce((a,p)=>a+p[k],0)/pts.length;
    const ref={r:avg('r'),g:avg('g'),b:avg('b'),l:avg('l')};
    const spread=pts.reduce((a,p)=>a+colorDistance(p,ref),0)/pts.length;
    learned.push({
      ...spec,
      ref,
      spread:+spread.toFixed(1),
      samples:pts.length,
      sampleRefs:pts.map(p=>({r:+p.r.toFixed(1),g:+p.g.toFixed(1),b:+p.b.toFixed(1),l:+p.l.toFixed(1)}))
    });
    details.push(`${spec.id}: ${pts.length}/8`);
  }
  if(learned.length<5){
    setStatus('Calibrazione debole: '+details.join(' · '));
    return false;
  }
  colorCalibration={mode:'supervised-columns-v2',createdAt:new Date().toISOString(),columns:COLOR_TEST_COLUMNS,colors:learned};
  localStorage.setItem(COLOR_CAL_KEY,JSON.stringify(colorCalibration));
  assumeFullGrid=true;
  const fullBtn=document.getElementById('fullGridMode');
  fullBtn.classList.add('active');
  fullBtn.textContent='Griglia piena accesa';
  setStatus('Colori calibrati: '+details.join(' · '));
  scan(true);
  return true;
}
function send(silent=false){
  const sig=JSON.stringify(lastGrid);
  if(silent&&sig===lastSentSignature)return;
  lastSentSignature=sig;
  const payload={source:'camera-scanner',time:Date.now(),grid:lastGrid};
  try{localStorage.setItem(KEY,JSON.stringify(payload))}catch(e){}
  try{new BroadcastChannel(CH).postMessage(payload)}catch(e){}
  if(!silent)setStatus('Inviata. Torna alla mappa e premi Genera.');
}
function nearestCorner(viewX,viewY){
  let best={i:-1,d:Infinity};
  corners.forEach((p,i)=>{
    const v=videoToView(p), d=Math.hypot(v.x-viewX,v.y-viewY);
    if(d<best.d)best={i,d};
  });
  return best.d<28?best.i:-1;
}
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(manualMode){
    const p=viewToVideo(x,y);
    if(corners.length>=4)corners=[];
    corners.push(p);
    trackQuality=corners.length===4?.75:.2;
    setStatus(corners.length<4?'Angolo '+corners.length+' impostato. Continua in ordine 1 alto-sinistra, 2 alto-destra, 3 basso-destra, 4 basso-sinistra.':'Angoli manuali pronti. Trascina per correggere, poi Leggi colori.');
    if(corners.length===4){manualMode=false;document.getElementById('manual').classList.remove('active')}
    return;
  }
  if(corners.length!==4)return;
  draggingCorner=nearestCorner(x,y);
  if(draggingCorner>=0){
    canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
    corners[draggingCorner]=viewToVideo(x,y);
    setStatus('Correzione manuale angolo '+(draggingCorner+1)+'.');
  }
});
canvas.addEventListener('pointermove',e=>{
  if(draggingCorner<0)return;
  const r=canvas.getBoundingClientRect();
  corners[draggingCorner]=viewToVideo(e.clientX-r.left,e.clientY-r.top);
});
canvas.addEventListener('pointerup',()=>{draggingCorner=-1});
canvas.addEventListener('pointercancel',()=>{draggingCorner=-1});
document.getElementById('start').onclick=()=>start().catch(e=>setStatus('Errore camera: '+e.message));
document.getElementById('track').onclick=detectOnce;
document.getElementById('manual').onclick=e=>{
  manualMode=true;corners=[];trackQuality=0;
  e.currentTarget.classList.add('active');
  setStatus('Clicca i 4 angoli: 1 alto-sinistra, 2 alto-destra, 3 basso-destra, 4 basso-sinistra.');
};
document.getElementById('scan').onclick=()=>scan(false);
document.getElementById('calibrateColors').onclick=()=>calibrateColors();
document.getElementById('resetCalibration').onclick=()=>{
  colorCalibration=null;localStorage.removeItem(COLOR_CAL_KEY);
  setStatus('Calibrazione colore cancellata.');
};
document.getElementById('fullGridMode').onclick=e=>{
  assumeFullGrid=!assumeFullGrid;
  e.currentTarget.classList.toggle('active',assumeFullGrid);
  e.currentTarget.textContent=assumeFullGrid?'Griglia piena accesa':'Griglia piena spenta';
  setStatus(assumeFullGrid?'Modalita test: considero una pedina in ogni cella con colore calibrato.':'Modalita reale: rilevo solo pedine presenti.');
};
document.getElementById('terrainMode').onclick=e=>{
  readTerrains=!readTerrains;
  e.currentTarget.classList.toggle('active',readTerrains);
  e.currentTarget.textContent=readTerrains?'Terreni accesi':'Terreni spenti';
};
document.getElementById('copyDebug').onclick=()=>{
  const txt=JSON.stringify(lastDebug,null,2);
  if(navigator.clipboard)navigator.clipboard.writeText(txt);
  setStatus('Debug copiato: '+lastDebug.length+' celle annotate.');
};
document.getElementById('saveSnapshot').onclick=()=>{
  if(!rawCanvas.width){setStatus('Nessun frame camera disponibile.');return}
  scan(true);
  const payload={
    version:1,
    createdAt:new Date().toISOString(),
    video:{width:rawCanvas.width,height:rawCanvas.height},
    corners,
    colorCalibration,
    assumeFullGrid,
    debug:lastDebug,
    allCells:allCellDebug(),
    grid:lastGrid,
    image:rawCanvas.toDataURL('image/jpeg',.86)
  };
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='asma-camera-snapshot.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  setStatus('Snapshot scaricato. Allegamelo qui e posso testare sul frame reale.');
};
document.getElementById('send').onclick=()=>send(false);
listCameras().catch(()=>{});
renderPreview();
</script>
